<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A clay 3D street football (panna) game in the browser: 1v1 in the cage, three grounds with their own rules.">
<meta property="og:title" content="Panna Cage">
<meta property="og:description" content="1v1 street football in a clay cage. Nutmeg your rival.">
<meta name="theme-color" content="#1d1a17">
<link rel="icon" href="data:,">
<title>Panna Cage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL cage diorama; HUD floats in the corners like stickers on a toy box. */
:root{
  --bg:#f8f1e7;          /* scene backdrop, rewritten per time of day */
  --ink:#1d1a17;         /* HUD plates */
  --ink-2:#2c2823;
  --chalk:#fbf8f1;       /* text on plates, chalk marks */
  --marigold:#f3a712;    /* accent: runs, active states */
  --teal:#2c8c86;        /* secondary: house-wall teal */
  --red:#d6402b;         /* wickets */
  --muted:#b9b1a3;
  --plate:rgba(29,26,23,.86);
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pixel:"Silkscreen",ui-monospace,"Courier New",monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);transition:background .8s}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.pixel #c{image-rendering:pixelated}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--marigold);outline-offset:2px}

/* brand */
#brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));pointer-events:none;max-width:300px;background:rgba(251,248,241,.9);border-radius:14px;padding:12px 14px;box-shadow:0 4px 0 rgba(29,26,23,.15)}
body.dark #brand{background:var(--plate)}
#brand h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:.95;margin:0;color:var(--ink);letter-spacing:.01em}
#brand h1 span{color:var(--red)}
#brand .sub{font-family:var(--pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;color:var(--ink);opacity:.75}
#keys{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--ink);opacity:.82}
#keys kbd{font-family:var(--pixel);font-size:10px;background:var(--ink);color:var(--chalk);padding:1px 5px;border-radius:3px;justify-self:start}
body.dark #brand h1,body.dark #brand .sub,body.dark #keys{color:var(--chalk)}
body.dark #keys kbd{background:var(--chalk);color:var(--ink)}

/* scoreboard */
#board{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;background:var(--plate);color:var(--chalk);border-radius:999px;padding:6px 8px;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
#board .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 14px;border-right:1px solid rgba(251,248,241,.14)}
#board .cell:last-of-type{border-right:0}
#board .lab{font-family:var(--pixel);font-size:9px;letter-spacing:.12em;color:var(--muted)}
#board b{font-family:var(--pixel);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
#board .main b{font-size:24px;color:var(--marigold)}
#overdots{display:flex;gap:4px;align-items:center;padding:0 10px 0 6px}
#overdots i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 9px var(--pixel);font-style:normal;background:rgba(251,248,241,.1);color:var(--chalk)}
#overdots i.r4,#overdots i.r6{background:var(--marigold);color:var(--ink)}
#overdots i.w{background:var(--red)}
#overdots i.e{background:transparent;border:1px dashed rgba(251,248,241,.25)}

/* side panel */
#panel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:178px;background:var(--plate);color:var(--chalk);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12px}
#panel h4{margin:0 0 5px;font-family:var(--pixel);font-weight:400;font-size:9px;letter-spacing:.14em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg.four{grid-template-columns:repeat(2,1fr)}
.seg button{background:rgba(251,248,241,.08);border:0;border-radius:7px;padding:6px 4px;font-size:11.5px;font-weight:600}
.seg button:hover{background:rgba(251,248,241,.16)}
.seg button.on{background:var(--marigold);color:var(--ink)}
#panelToggle{display:none;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:0;background:var(--plate);color:var(--chalk);font:700 15px var(--pixel)}

/* bottom bar */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
#rules{background:var(--plate);color:var(--chalk);border-radius:12px;padding:9px 12px;font-size:11.5px;line-height:1.45;max-width:270px}
#rules b{font-family:var(--pixel);font-weight:400;font-size:9px;letter-spacing:.14em;color:var(--marigold);display:block;margin-bottom:2px}
#controls{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.aim{display:flex;background:var(--plate);border-radius:999px;padding:4px;gap:3px}
.aim button{border:0;background:transparent;color:var(--chalk);border-radius:999px;padding:9px 13px;font:700 11px var(--pixel);letter-spacing:.06em}
.aim button.on{background:var(--chalk);color:var(--ink)}
.aim button#loft.on{background:var(--red);color:var(--chalk)}
#act{flex:none;border:0;width:88px;height:88px;padding:0;border-radius:50%;background:var(--marigold);color:var(--ink);font:400 17px var(--display);box-shadow:0 6px 0 #b77b06;display:none}
#act:active{transform:translateY(4px);box-shadow:0 2px 0 #b77b06}
#act.run{background:var(--teal);color:var(--chalk);box-shadow:0 6px 0 #1b5d59}
body.touch #act{display:block}
#hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:700 12px var(--pixel);letter-spacing:.1em;color:var(--chalk);background:var(--ink);padding:6px 12px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#hint.show{opacity:1}
body.touch #hint{bottom:calc(122px + env(safe-area-inset-bottom,0px))}

/* popups */
#pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#pop .big{font-family:var(--display);font-size:clamp(34px,7vw,74px);line-height:1;color:var(--chalk);-webkit-text-stroke:2px var(--ink);text-shadow:0 5px 0 var(--ink);white-space:nowrap}
#pop .big.gold{color:var(--marigold)}
#pop .big.out{color:var(--red)}
#pop .sub{display:inline-block;margin-top:10px;font-weight:800;font-size:15px;background:var(--ink);color:var(--chalk);padding:5px 12px;border-radius:999px}
#pop.anim{animation:pop 1.9s cubic-bezier(.2,1.4,.4,1) both}
body.paused #pop.anim{animation:none;opacity:1;transform:translate(-50%,-50%)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}12%{transform:translate(-50%,-50%) scale(1.06);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#timing{position:fixed;pointer-events:none;font:700 13px var(--pixel);letter-spacing:.08em;color:var(--ink);background:var(--chalk);padding:3px 8px;border-radius:6px;opacity:0;white-space:nowrap;transform:translate(-50%,-100%)}
#timing.show{animation:tim 1.1s ease-out both}
#timing.perfect{background:var(--marigold)}
#timing.bad{background:var(--red);color:var(--chalk)}
@keyframes tim{0%{opacity:0;margin-top:8px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-14px}}
.bubble{position:fixed;pointer-events:none;background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px;border:2px solid var(--ink);transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
#next{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:400 10px var(--pixel);letter-spacing:.12em;color:var(--chalk);background:var(--plate);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
#next:empty{display:none}

/* overlay card */
#overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(29,26,23,.28);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#card{width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--chalk);color:var(--ink);border-radius:18px;padding:24px 24px 20px;box-shadow:0 10px 0 var(--ink);border:3px solid var(--ink)}
#card h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:.95;margin:0;text-wrap:balance}
#card h2 span{color:var(--red)}
#card .lede{font-size:15px;line-height:1.45;margin:12px 0 14px}
#card .lede b{font-family:var(--pixel);font-size:14px;color:var(--red)}
#card h3{font-family:var(--pixel);font-weight:400;font-size:10px;letter-spacing:.14em;margin:14px 0 6px;color:var(--teal)}
#card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.5}
#card .go{margin-top:18px;width:100%;border:0;border-radius:12px;background:var(--marigold);color:var(--ink);font:400 20px var(--display);padding:14px;box-shadow:0 5px 0 #b77b06}
#card .go:active{transform:translateY(3px);box-shadow:0 2px 0 #b77b06}
#card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#card .stats div{background:#efe9dc;border-radius:10px;padding:8px;text-align:center}
#card .stats b{display:block;font:700 20px var(--pixel)}
#card .stats span{font-size:11px;opacity:.75}

/* bowling panel */
#bowlUI{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 32px));background:var(--plate);color:var(--chalk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:9px}
body.touch #bowlUI{bottom:calc(118px + env(safe-area-inset-bottom,0px))}
#typeSeg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
#typeSeg button{border:0;border-radius:8px;background:rgba(251,248,241,.08);color:var(--chalk);padding:8px 2px;font:700 10px var(--pixel);letter-spacing:.04em}
#typeSeg button.on{background:var(--marigold);color:var(--ink)}
.meter{position:relative;height:12px;margin:4px 6px;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--marigold) 34%,#3fae6a 44%,#3fae6a 56%,var(--marigold) 66%,var(--red))}
#needle{position:absolute;top:-5px;width:5px;height:22px;background:var(--chalk);border:1.5px solid var(--ink);border-radius:2px;left:50%;transform:translateX(-50%)}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#readout{font:700 10px var(--pixel);letter-spacing:.08em;color:var(--chalk)}
#bowlBtn{border:0;border-radius:999px;background:var(--red);color:var(--chalk);font:400 13px var(--display);padding:7px 16px}
body.touch #bowlBtn{display:none}
body.bowling #rules{display:none}
body.bowling #hint{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
body.touch.bowling #hint{bottom:calc(232px + env(safe-area-inset-bottom,0px))}
body.mode-bowl .aim{display:none}
#act.bowl{background:var(--red);color:var(--chalk);box-shadow:0 6px 0 #8e2a1c}
#card .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
#card .go.mode{margin:0;padding:12px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
#card .go.mode b{font:400 18px var(--display)}
#card .go.mode span{font:600 11.5px/1.3 var(--body)}
#card .go.mode small{font:400 9px var(--pixel);letter-spacing:.06em;opacity:.75}
@media (max-width:520px){#card .go.mode small{display:none}}
#card .locs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#card .loc{border:2px solid var(--ink);border-radius:10px;background:#efe9dc;color:var(--ink);padding:8px 6px;display:flex;flex-direction:column;gap:3px;text-align:left}
#card .loc b{font:400 12px var(--display)}
#card .loc span{font:600 11px/1.25 var(--body);opacity:.8}
#card .loc.on{background:var(--teal);color:var(--chalk)}
@media (max-width:520px){#card .locs{grid-template-columns:1fr 1fr}}
#card .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#card .go.alt{background:#efe9dc;box-shadow:0 5px 0 var(--ink)}
@media (max-width:520px){#card .modes{grid-template-columns:1fr}#card .go.mode{flex-direction:row;justify-content:space-between;text-align:left;padding:12px 14px}}
@media (max-width:820px){
  #rules,#keys{display:none}
  #panel{display:none;top:calc(60px + env(safe-area-inset-top,0px))}
  #panel.open{display:flex}
  #panelToggle{display:block}
  #brand h1{font-size:20px}
  #brand .sub{display:none}
  #board{top:calc(58px + env(safe-area-inset-top,0px));padding:4px 6px}
  #board .cell{padding:2px 8px}
  #board b{font-size:14px}
  #board .main b{font-size:19px}
  #overdots{display:none}
  #next{top:calc(112px + env(safe-area-inset-top,0px))}
  #bottom{justify-content:center}
  #brand{padding:8px 12px}
  #brand h1 br{display:none}
  #brand h1 span{margin-left:.25em}
  #brand h1{font-size:17px}
  #board{top:calc(64px + env(safe-area-inset-top,0px))}
  #next{top:calc(118px + env(safe-area-inset-top,0px))}
  .spacer{display:none}
}
/* ---- phone controls (touch devices): floating left stick, right-thumb action cluster ---- */
body.touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.touch button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stickZone,#stick,.tbtn{display:none}
body.touch #stickZone{display:block;position:fixed;left:0;bottom:0;top:calc(64px + env(safe-area-inset-top,0px));width:46%;touch-action:none;z-index:2}
body.touch #stick{display:block;position:fixed;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none;z-index:3;opacity:.55;transition:opacity .15s}
body.touch #stick.on{opacity:1;transition:none}
#stick .base{position:absolute;inset:0;border-radius:50%;background:rgba(29,26,23,.38);border:2px solid rgba(251,248,241,.55);box-shadow:inset 0 0 0 10px rgba(251,248,241,.06)}
#stick .knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--chalk);box-shadow:0 3px 0 rgba(0,0,0,.35);border:2px solid var(--ink)}
#stick .lb{position:absolute;font:700 9px var(--pixel);letter-spacing:.08em;color:var(--chalk);text-shadow:0 1px 0 var(--ink)}
#stick .lb.l{left:-34px;top:50%;margin-top:-6px}
#stick .lb.r{right:-30px;top:50%;margin-top:-6px}
#stick .lb.u{left:50%;top:-18px;transform:translateX(-50%)}
#stick .lb.on{color:var(--marigold)}
body.stick-bowl #stick .lb{display:none}
body.touch .aim{display:none}
body.touch #act{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:96px;height:96px;z-index:4;display:block}
#act.idle{opacity:.5}
body.touch .tbtn{display:grid;place-items:center;position:fixed;z-index:4;width:54px;height:54px;border-radius:50%;border:2px solid var(--chalk);background:var(--plate);color:var(--chalk);font:700 9px/1.1 var(--pixel);letter-spacing:.04em;text-align:center;padding:0}
body.touch .tbtn:active{transform:scale(.94)}
#typeBtn{right:calc(132px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#camBtn{right:calc(116px + env(safe-area-inset-right,0px));bottom:calc(94px + env(safe-area-inset-bottom,0px))}
#pauseMini{right:calc(46px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px))}
body.touch #typeBtn{display:none}
body.touch.bowling #typeBtn{display:grid;width:auto;min-width:54px;height:40px;padding:0 12px;border-radius:999px;background:var(--marigold);color:var(--ink);border-color:var(--ink);bottom:calc(30px + env(safe-area-inset-bottom,0px))}
/* rotate prompt: phones in portrait */
#rotate{display:none;position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--chalk);place-items:center;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#rotate .ph{width:70px;height:120px;border:4px solid var(--chalk);border-radius:14px;margin:0 auto 22px;position:relative;animation:turn 2.2s ease-in-out infinite}
#rotate .ph:after{content:"";position:absolute;left:50%;bottom:8px;width:18px;height:4px;margin-left:-9px;border-radius:2px;background:var(--chalk)}
#rotate h2{font:400 26px var(--display);margin:0 0 8px}
#rotate h2 span{color:var(--marigold)}
#rotate p{margin:0 0 18px;font-size:15px;opacity:.8}
#rotate button{border:0;border-radius:12px;background:var(--marigold);color:var(--ink);font:400 16px var(--display);padding:12px 18px}
@keyframes turn{0%,20%{transform:rotate(0)}55%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (pointer:coarse) and (orientation:portrait){#rotate{display:grid}}
/* compact HUD for phones held sideways */
@media (pointer:coarse) and (orientation:landscape){
  #brand{padding:6px 10px;top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px))}
  #brand h1{font-size:14px}
  #brand h1 br{display:none}
  #brand h1 span{margin-left:.25em}
  #brand .sub,#keys,#rules,.spacer{display:none}
  #board{top:calc(8px + env(safe-area-inset-top,0px));padding:3px 6px}
  #board .cell{padding:1px 9px}
  #board b{font-size:13px}
  #board .main b{font-size:18px}
  #board .lab{font-size:8px}
  #overdots{display:none}
  #next{top:calc(54px + env(safe-area-inset-top,0px));font-size:9px;padding:3px 8px}
  #panelToggle{display:block;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:36px;height:36px}
  #panel{display:none;top:calc(50px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));max-height:calc(100% - 60px);overflow:auto;z-index:20}
  #panel.open{display:flex}
  body.touch #hint,body.touch.bowling #hint{top:calc(84px + env(safe-area-inset-top,0px));bottom:auto;font-size:10px}
  body.touch #bowlUI{bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(300px,34%);padding:8px 10px;gap:6px}
  body.touch #typeSeg{display:none}
  #pop{top:44%}
  #pop .big{font-size:clamp(28px,6vw,52px)}
  #card{width:min(680px,100%);padding:16px 18px 14px}
  #card h2{font-size:30px}
  #card .lede{margin:6px 0 8px}
  #card .modes{grid-template-columns:repeat(3,1fr)}
  #card .go.mode{flex-direction:column;justify-content:center;text-align:center;padding:10px 8px}
  #card .locs{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none}}
@media (prefers-reduced-motion:reduce){#pop.anim{animation-duration:.01s;animation-delay:0s}}

/* ---- panna cage additions ---- */
#board .side b{font-size:26px;color:var(--chalk)}
#board .side{min-width:86px}
#board .main b{color:var(--marigold)}
#board .lab{white-space:nowrap}
.stams{display:flex;gap:14px;align-items:flex-end;pointer-events:none}
.stam{display:flex;align-items:center;gap:8px;background:var(--plate);color:var(--chalk);border-radius:999px;padding:7px 12px;font:700 10px var(--pixel);letter-spacing:.08em}
.stam i{display:block;width:120px;height:9px;border-radius:999px;background:rgba(251,248,241,.18);overflow:hidden}
.stam i b{display:block;height:100%;width:100%;background:var(--teal);border-radius:999px}
.stam.low i b{background:var(--red)}

      const x = rainSeed[i * 3] + y * 0.12, z = rainSeed[i * 3 + 2];
      rainPos.set([x, y, z, x - 0.07, y - 0.55, z], i * 6);
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  rioKites.forEach(k => { const b = k.userData.base; k.position.set(b.x + Math.sin(t * 0.6 + k.userData.ph) * 0.7, b.y + Math.sin(t * 1.2 + k.userData.ph) * 0.4, b.z); k.rotation.z = Math.sin(t + k.userData.ph) * 0.3; });
}

/* ================= HUD ================= */

function project(v) { tmp2.copy(v).project(cam); return [(tmp2.x + 1) / 2 * innerWidth, (1 - tmp2.y) / 2 * innerHeight]; }
const floaters = [];

function updOverlayEls(dt) {

  if (shooter) { const [x, y] = project(tmp.set(shooter.pos.x, 2.3, shooter.pos.z)); ch.style.left = x + 'px'; ch.style.top = y + 'px'; $('chargeFill').style.width = (shooter.charge * 100) + '%'; }
  const me = players[0], playing = state === 'play' || state === 'kickoff';

}

function showOver(w) {

/* ================= input ================= */
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Slash', 'Enter']);
addEventListener('keydown', e => {
  const k = e.code;
  if (!$('overlay').hidden) {
    if ((k === 'Space' || k === 'Enter') && e.target.tagName !== 'BUTTON') { e.preventDefault(); const g = document.querySelector('#card .go'); if (g) g.click(); }
    return;
  }
  if (k === 'Escape') { setPaused(!paused); return; }
  if (GAME_KEYS.has(k)) e.preventDefault();
  if (e.target.tagName === 'BUTTON' && (k === 'Space' || k === 'Enter')) e.preventDefault();
  if (!e.repeat) pressed.add(k);
  keys.add(k); ac();
  if (k === 'KeyT') { const nm = Object.keys(TIMES); setTime(nm[(nm.indexOf(timeName) + 1) % nm.length]); }
  else if (k === 'KeyP') togglePixel();
  else if (k === 'KeyM') toggleSound();
  else if (k === 'KeyR') showIntro();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
const actBtn = $('act');
actBtn.addEventListener('pointerdown', e => { e.preventDefault(); ac(); touch.act = true; try { actBtn.setPointerCapture(e.pointerId); } catch (err) {} });
['pointerup', 'pointercancel'].forEach(ev => actBtn.addEventListener(ev, () => { touch.act = false; }));
$('typeBtn').addEventListener('pointerdown', e => { e.preventDefault(); touch.panna = true; });
const sprintBtn = $('camBtn');
sprintBtn.addEventListener('pointerdown', e => { e.preventDefault(); touch.sprint = true; try { sprintBtn.setPointerCapture(e.pointerId); } catch (err) {} });
['pointerup', 'pointercancel'].forEach(ev => sprintBtn.addEventListener(ev, () => { touch.sprint = false; }));
$('pauseMini').addEventListener('pointerdown', e => { e.preventDefault(); setPaused(!paused); });
$('timeSeg').onclick = e => { const b = e.target.closest('button'); if (b) { ac(); setTime(b.dataset.v); } };

function optBtn(v, on) { document.querySelector(`#optSeg [data-v="${v}"]`).classList.toggle('on', on); }
$('optSeg').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v === 'pixel') togglePixel();

};
$('restartBtn').onclick = () => showIntro();
function setPaused(v) { paused = v; document.body.classList.toggle('paused', v); $('pauseBtn').textContent = paused ? 'Resume' : 'Pause'; $('pauseBtn').classList.toggle('on', paused); if (paused) pop('PAUSED', isTouch ? 'Tap II to carry on' : 'Press Esc to carry on', ''); else $('pop').classList.remove('anim'); }

$('panelToggle').onclick = () => $('panel').classList.toggle('open');

document.querySelectorAll('#panel button').forEach(b => b.addEventListener('mouseup', () => b.blur()));

function goLandscape() {
  if (!isTouch) return;
  const el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
  try {
    const pr = rq && !document.fullscreenElement ? rq.call(el, { navigationUI: 'hide' }) : null;
    Promise.resolve(pr).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
  } catch (e) {}
}
function buzz(p) { try { if (isTouch && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
$('rotBtn').onclick = () => goLandscape();
// floating stick: appears wherever the left thumb lands
{
  const zone = $('stickZone'), el = $('stick'), knob = el.querySelector('.knob'), R = 52;
  const rest = () => { el.style.left = `calc(${88}px + env(safe-area-inset-left, 0px))`; el.style.top = `calc(100% - ${96}px - env(safe-area-inset-bottom, 0px))`; knob.style.transform = ''; };
  rest();
  const move = e => {
    let dx = e.clientX - stick.cx, dy = e.clientY - stick.cy; const d = Math.hypot(dx, dy);
    if (d > R) { dx *= R / d; dy *= R / d; }
    stick.x = dx / R; stick.y = dy / R; knob.style.transform = `translate(${dx}px,${dy}px)`;
  };
  zone.addEventListener('pointerdown', e => {
    e.preventDefault(); ac();
    if (stick.id !== null) return;
    stick.id = e.pointerId; stick.on = true; stick.cx = e.clientX; stick.cy = e.clientY;
    try { zone.setPointerCapture(e.pointerId); } catch (err) {}
    el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px'; el.classList.add('on'); move(e);
  });
  zone.addEventListener('pointermove', e => { if (e.pointerId === stick.id) move(e); });
  const up = e => { if (e.pointerId !== stick.id) return; stick.id = null; stick.on = false; stick.x = stick.y = 0; el.classList.remove('on'); rest(); };
  zone.addEventListener('pointerup', up); zone.addEventListener('pointercancel', up);
}

/* ================= boot ================= */
resize();
{ let saved = 'london'; try { saved = localStorage.getItem('panna-cage-loc') || 'london'; } catch (e) {} setLocation(LOCS[saved] ? saved : 'london'); }

let last = performance.now(), speedMul = 1;
window.__panna = { stats, get state() { return state; }, get mode() { return mode; }, get clock() { return clock; }, score, pannas, ball, players, AI, LOCS,
  startGame, setLocation, setTime, showIntro, bot: null, aiBoth: false, set speed(v) { speedMul = v; } };
showIntro();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const portraitBlock = isTouch && innerHeight > innerWidth;
  if (!paused && !portraitBlock) { const n = speedMul | 0 || 1; for (let i = 0; i < n; i++) update(dt); }
